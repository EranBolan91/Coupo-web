name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Job-wide: firebase.json's hosting predeploy rebuilds the site during the deploy step too.
    env:
      VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
      VITE_AUTH_DOMAIN: ${{ secrets.VITE_AUTH_DOMAIN }}
      VITE_PROJECT_ID: ${{ secrets.VITE_PROJECT_ID }}
      VITE_STORAGE_BUCKET: ${{ secrets.VITE_STORAGE_BUCKET }}
      VITE_MESSAGING_SENDER_ID: ${{ secrets.VITE_MESSAGING_SENDER_ID }}
      VITE_APP_ID: ${{ secrets.VITE_APP_ID }}
      VITE_MEASUREMENT_ID: ${{ secrets.VITE_MEASUREMENT_ID }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The site lives in frontend/; firebase.json (in "cloud functions") serves "cloud functions/public".
      # Vite bakes the Firebase config into the build. .env is not in git, so it comes from repo secrets.
      # Stop if any are missing or malformed: that ships a site that fails with auth/invalid-api-key.
      - run: |
          bash ../.github/scripts/check-firebase-env.sh
          npm ci && npm run build -- --outDir "../cloud functions/public" --emptyOutDir
          # The key must end up in the built app, or the live site fails on load.
          grep -rqF -- "$VITE_API_KEY" "../cloud functions/public/assets" || { echo "::error::The Firebase API key is not in the built app"; exit 1; }
        working-directory: frontend
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COUPO_E03C4 }}
          channelId: live
          projectId: coupo-e03c4
          entryPoint: "cloud functions"
      # The deploy step rebuilds the site (predeploy in firebase.json); confirm what it uploaded has the key.
      - run: grep -rqF -- "$VITE_API_KEY" "cloud functions/public/assets" || { echo "::error::The deployed build has no Firebase API key"; exit 1; }
