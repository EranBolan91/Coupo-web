<!DOCTYPE html>
<html lang="en" data-theme="coupo">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Coupo: find, share and vote on coupon codes." />
    <title>Coupo</title>
    <script>
      // Apply the theme before first paint (no light flash in dark mode). Kept in sync with src/hooks/useTheme.ts.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("coupo-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "coupo-dark" : "coupo");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
