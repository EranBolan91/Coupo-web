<!DOCTYPE html>
<html lang="en" data-theme="coupo">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- preview:start -->
    <!-- Link preview tags (WhatsApp, Telegram, X...). On coupon pages the couponPreview Cloud Function replaces everything up to preview:end. -->
    <title>Coupo</title>
    <meta name="description" content="Coupo: find, share and vote on coupon codes." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Coupo" />
    <meta property="og:url" content="https://coupo-e03c4.web.app/" />
    <meta property="og:title" content="Coupo" />
    <meta property="og:description" content="Find, share and vote on coupon codes." />
    <meta property="og:image" content="https://coupo-e03c4.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Coupo" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- preview:end -->
    <script>
      // Apply the theme before first paint (no light flash in dark mode). Kept in sync with src/hooks/useTheme.ts.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("coupo-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", dark ? "coupo-dark" : "coupo");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
